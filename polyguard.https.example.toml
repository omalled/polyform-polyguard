[listener]
address = "0.0.0.0:8443"
management_address = "127.0.0.1:9090"
trust_forwarding_headers = false
security_mode = "agreement"
agreement_implementations = 2
max_connections = 128
request_header_timeout_ms = 5000
request_body_timeout_ms = 30000
upstream_connect_timeout_ms = 3000
upstream_response_timeout_ms = 30000
graceful_shutdown_timeout_ms = 10000

[listener.tls]
certificate_chain_file = "/etc/polyguard/tls/fullchain.pem"
private_key_file = "/etc/polyguard/tls/private-key.pem"

[limits]
max_request_body_bytes = 8388608
max_response_header_bytes = 32768
max_response_body_bytes = 16777216
max_inflight_body_bytes = 134217728

[[upstreams]]
name = "app"
address = "127.0.0.1:3000"

[[routes]]
host = "example.test"
path_prefix = "/"
upstream = "app"
