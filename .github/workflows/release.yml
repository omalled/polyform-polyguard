name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Package and checksum
        run: |
          install -m 0755 target/release/polyguard polyguard-x86_64-unknown-linux-gnu
          sha256sum polyguard-x86_64-unknown-linux-gnu > polyguard-x86_64-unknown-linux-gnu.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" polyguard-x86_64-unknown-linux-gnu polyguard-x86_64-unknown-linux-gnu.sha256 --clobber
