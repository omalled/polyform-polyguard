name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --tag polyguard:ci .
      - run: docker run --rm polyguard:ci --help

  portable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install --yes musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin polyguard
      - name: Verify portable binary has no dynamic interpreter
        run: |
          file target/x86_64-unknown-linux-musl/release/polyguard
          if readelf --program-headers target/x86_64-unknown-linux-musl/release/polyguard | grep --quiet "Requesting program interpreter"; then
            exit 1
          fi
      - name: Smoke test on an older Linux userspace
        run: docker run --rm --platform linux/amd64 --volume "$PWD/target/x86_64-unknown-linux-musl/release/polyguard:/polyguard:ro" ubuntu:18.04 /polyguard --help
