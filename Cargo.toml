[package]
name = "polyform-polyguard"
version = "0.1.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
polyform-runtime = { path = "vendor/polyform-runtime" }

[[bin]]
name = "polyguard"
path = "src/main.rs"

[[bin]]
name = "polyguard-fuzz"
path = "src/bin/polyguard-fuzz.rs"
