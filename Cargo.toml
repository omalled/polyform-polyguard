[package]
name = "polyform-polyguard"
version = "0.3.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
flate2 = "1"
polyform-runtime = { path = "vendor/polyform-runtime" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = "0.14"

[[bin]]
name = "polyguard"
path = "src/main.rs"

[[bin]]
name = "polyguard-fuzz"
path = "src/bin/polyguard-fuzz.rs"
