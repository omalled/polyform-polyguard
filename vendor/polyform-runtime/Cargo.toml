[package]
name = "polyform-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/omalled/polyform"
description = "Runtime composition and privacy-minimal telemetry client for Polyform applications"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
ureq = { version = "2.10", features = ["json"] }
